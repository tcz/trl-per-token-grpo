[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trl-per-token-grpo"
version = "0.1.0"
description = "Per-token advantages for TRL's GRPOTrainer"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["torch>=2.0"]

[project.optional-dependencies]
trainer = ["trl>=0.29", "transformers>=4.40"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
